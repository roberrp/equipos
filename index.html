<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Equipo de voleibol</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #eeeeee;
            margin: 0;
            padding: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
        }

        h2 {
            text-align: center;
            margin-top: 50px;
            margin-bottom: 25px;
        }

        .cromos {
            display: grid;
            grid-template-columns: repeat(4, 220px);
            justify-content: center;
            gap: 25px;
        }

        .cromo {
            position: relative;
            width: 220px;
            cursor: pointer;
        }

        .cromo img {
            width: 100%;
            display: block;
            border-radius: 12px;
        }

        /* Segunda imagen */

        .cromo .imagen-hover {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* Al pasar el ratón */

        .cromo:hover .imagen-hover {
            opacity: 1;
        }

        /* En pantallas pequeñas */

        @media (max-width: 1000px) {
            .cromos {
                grid-template-columns: repeat(3, 220px);
            }
        }

        @media (max-width: 750px) {
            .cromos {
                grid-template-columns: repeat(2, 220px);
            }
        }

        @media (max-width: 500px) {
            .cromos {
                grid-template-columns: 1fr;
            }

            .cromo {
                margin: auto;
            }
        }

    </style>
</head>

<body>

    <h1>Equipo de Voleibol</h1>
