<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cromos de voleibol</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eeeeee;
            margin: 0;
            padding: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
        }

        .cromos {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .cromo {
            width: 220px;
            position: relative;
            cursor: pointer;
        }

        .cromo img {
            width: 100%;
            display: block;
            border-radius: 12px;
        }

        /* Imagen que aparece al pasar el ratón */
        .cromo .imagen-hover {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .cromo:hover .imagen-hover {
            opacity: 1;
        }
    </style>
</head>

<body>

    <h1>Equipo Alevín</h1>

    <div class="cromos">

        <div class="cromo">
            <img src="imagenes/01.jpg" alt="Jugador">
            <img src="imagenes/02.jpg" class="imagen-hover" alt="Jugador">
        </div>

    </div>

</body>
</html>
